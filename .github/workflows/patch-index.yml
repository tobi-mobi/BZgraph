name: Patch index

# Keeps patch-index/index.json up to date from the Hypixel SkyBlock Patch Notes forum.
# New patches are proposed in a pull request (branch "patch-index/auto") so a human can write the
# summaries and fix item tags before merging. The mod downloads the merged file from the default branch.
#
# Repository setting required for the PR step:
#   Settings → Actions → General → Workflow permissions → "Allow GitHub Actions to create and approve pull requests"

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:
    inputs:
      mode:
        description: "rss = new patches only, backfill = walk the whole forum (first run)"
        type: choice
        options: [rss, backfill]
        default: rss
      max_pages:
        description: "backfill: number of forum pages to walk"
        default: "60"
  pull_request:
    paths:
      - "patch-index/**"
  push:
    branches: [main, master]
    paths:
      - "patch-index/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: patch-index
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate index.json
        run: python patch-index/scripts/update_index.py --mode validate
      - name: Tagger tests
        run: python -m unittest discover -s patch-index/scripts -v

  # The mod keeps whichever copy of the index (download cache or the one bundled in the jar) has the newer
  # "updated" stamp. If index.json changes on main without a new stamp (e.g. a summary edited on GitHub),
  # players would keep a stale cached copy, so bump it here. Pushes made with GITHUB_TOKEN don't re-trigger
  # workflows, so this can't loop.
  bump-timestamp:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bump "updated" if the patches changed without it
        run: |
          git show "${{ github.event.before }}:patch-index/index.json" > "$RUNNER_TEMP/prev.json" 2>/dev/null \
            || rm -f "$RUNNER_TEMP/prev.json"
          python patch-index/scripts/update_index.py --mode touch --base "$RUNNER_TEMP/prev.json"
          if git diff --quiet -- patch-index/index.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Patch index: bump updated timestamp" -- patch-index/index.json
          git push origin "HEAD:${{ github.ref_name }}"

  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      BRANCH: patch-index/auto
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Continue an open auto-PR instead of opening a new one each run.
      - name: Reuse pending branch
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -B "$BRANCH"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update index
        run: |
          python patch-index/scripts/update_index.py \
            --mode "${{ inputs.mode || 'rss' }}" \
            --max-pages "${{ inputs.max_pages || '60' }}"

      - name: Open or update pull request
        run: |
          if git diff --quiet -- patch-index/index.json; then
            echo "No new patches."
            exit 0
          fi
          NEW=$(git diff -U0 -- patch-index/index.json | grep -c '^+ *"needsReview": true' || true)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patch-index/index.json
          git commit -m "Patch index: add ${NEW} new patch note(s)"
          git push --force-with-lease origin "$BRANCH"
          BODY=$(cat <<'EOF'
          New SkyBlock patch notes were found and added to `patch-index/index.json`.

          Before merging, for each entry with `"needsReview": true`:
          - write a 1–3 sentence `summary` **in your own words** (don't paste the forum post),
          - add `itemNotes` for the bazaar items the patch really affects, e.g.
            `"itemNotes": {"GLOSSY_GEMSTONE": "Drop rate doubled at every Breaking Power."}`
            (keys may end in `*`, like `ENCHANTMENT_KARMA_*`; use `{}` if no bazaar item is affected).
            Once `itemNotes` exists, `autoItems` is ignored — it's only a hint list of names found in the post,
          - remove `"needsReview": true`.

          The mod only reads the default branch, so nothing reaches players until this is merged.
          EOF
          )
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            echo "Updated existing pull request."
          else
            gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" \
              --title "Patch index: new patch notes" --body "$BODY"
          fi
