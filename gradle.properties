# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties (from the official fabric-example-mod 26.2 branch)
minecraft_version=26.2
loader_version=0.20.1
loom_version=1.19-SNAPSHOT

# Mod Properties
version=1.0.0
group=dev.bzgraph

# Default patch-note index URL baked into the mod (players can override it in config/bzgraph/config.json).
# Point this at the raw file on your repo's default branch, e.g.
#   https://raw.githubusercontent.com/<owner>/<repo>/main/patch-index/index.json
# or later at your Raspberry Pi. Leave empty to use only the copy bundled in the jar.
patch_index_url=

# Dependencies
fabric_api_version=0.161.0+26.2
junit_version=5.13.4
